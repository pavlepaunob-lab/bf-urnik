name: Build ICS and deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # svakog sata
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.js
      - name: Promene u odnosu na nedeljni snapshot
        id: promene
        run: |
          node scripts/promene.js | tee promene.log
          if grep -q SNAPSHOT_UPDATED promene.log; then echo "updated=true" >> "$GITHUB_OUTPUT"; fi
      - name: Nedeljni commit snapshota (drži cron aktivnim)
        if: steps.promene.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git commit -m "Nedeljni snapshot urnika $(cat snapshot/week.txt)" || exit 0
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
